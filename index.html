<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support Watch · 기업지원 레이더</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
  <a class="brand" href="https://gt10300407.github.io/support-watch-pages/index.html">
    <span class="brand-mark">SW</span>
    <span><strong>Support Watch</strong><small>기업지원 레이더</small></span>
  </a>
  <div id="compact-status" class="compact-status" aria-label="자동실행 상태">
    <span class="compact-live"><span id="status-dot" class="status-dot"></span><b id="status-live">정상</b></span>
    <span class="compact-sep">·</span>
    <span class="compact-item compact-generated">갱신 <b id="last-generated">12:51</b></span>
    <span class="compact-sep compact-generated">·</span>
    <span class="compact-item">다음수집 <b id="next-run-compact">15:00</b></span>
    <span class="compact-sep">·</span>
    <span class="compact-item">카카오 <b id="next-send-compact">15:00</b></span>
  </div>
  <nav class="navlinks">
    <a href="https://gt10300407.github.io/support-watch-pages/index.html">대시보드</a>
    <a href="https://gt10300407.github.io/support-watch-pages/index.html#office">🏢 공간지원</a>
    <a href="https://gt10300407.github.io/support-watch-pages/index.html#money">💰 자금</a>
    <a href="https://gt10300407.github.io/support-watch-pages/index.html#review">⚠️ 확인필요</a>
    <a href="https://gt10300407.github.io/support-watch-pages/system.html">시스템</a>
  </nav>
</header>

  <section class="metrics review-metrics">
    <div class="metric"><span>미검토</span><strong>1127</strong><small>아직 확인 안 함</small></div>
    <div class="metric metric-good"><span>신청예정</span><strong>0</strong><small>진행 예정</small></div>
    <div class="metric metric-office"><span>신청완료</span><strong>0</strong><small>접수 완료</small></div>
    <div class="metric metric-warn"><span>보류</span><strong>0</strong><small>추가 검토</small></div>
    <div class="metric"><span>검토완료</span><strong>0</strong><small>원문 확인 완료</small></div>
    <div class="metric metric-bad"><span>제외</span><strong>0</strong><small>진행하지 않음</small></div>
  </section>

  <section class="toolbar">
    <div class="tabs" id="tabs">
      <button class="active" data-mode="all">추천 전체</button>
      <button data-mode="unreviewed">⬜ 미검토</button>
      <button data-mode="planned">✅ 신청예정</button>
      <button data-mode="applied">📨 신청완료</button>
      <button data-mode="office">🏢 공간지원</button>
      <button data-mode="money">💰 자금</button>
      <button data-mode="rnd">🧪 R&D</button>
      <button data-mode="review">⚠️ 확인필요</button>
      <button data-mode="deadline">⏰ 마감임박</button>
    </div>
    <div class="filters">
      <input id="q" placeholder="공고명 · 기관 · 지원내용 검색">
      <select id="sort">
        <option value="recommend">추천순</option>
        <option value="deadline">마감순</option>
        <option value="newest">최신순</option>
      </select>
      <select id="elig">
        <option value="">AI 판정 전체</option>
        <option value="eligible">🟢 신청가능</option>
        <option value="review">🟡 확인필요</option>
        <option value="ineligible">🔴 신청불가</option>
      </select>
      <select id="user-status">
        <option value="">내 상태 전체</option>
        <option value="unreviewed">⬜ 미검토</option>
        <option value="reviewed">👀 검토완료</option>
        <option value="planned">✅ 신청예정</option>
        <option value="applied">📨 신청완료</option>
        <option value="hold">⏸ 보류</option>
        <option value="excluded">❌ 제외</option>
      </select>
    </div>
  </section>

  <section class="result-head">
    <div><h2 id="result-title">추천 공고</h2><p id="result-desc">회사 조건과 연관성이 높은 순서로 정렬했어.</p></div>
    <div class="count-badge"><b id="shown-count">0</b>건</div>
  </section>

  <main id="notice-root" class="notice-list"></main>

  <footer class="footer">AI 판정은 검토 보조용이고, 최종 신청 여부는 반드시 공고 원문을 기준으로 확인해.</footer>
</div>
<script src="assets/app.js"></script>
</body>
</html>
